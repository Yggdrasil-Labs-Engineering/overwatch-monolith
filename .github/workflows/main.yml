# =========================================================
# Monolith Continuous Integration Workflow
#
# Purpose:
# Validate Monolith archive integrity,
# storage systems, and intelligence
# preservation capabilities.
#
# Philosophy:
# Preserve Truth.
# Verify Integrity.
# Protect Memory.
# =========================================================

name: Monolith Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Integrity Tests
        run: |
          python -m tests.test_integrity

      - name: Run Archive Record Tests
        run: |
          python -m tests.test_archive_record

      - name: Run Storage Manager Tests
        run: |
          python -m tests.test_storage_manager
